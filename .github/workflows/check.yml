name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 仓库未提交 package-lock.json，故用 npm install 而非 npm ci
      - run: npm install --no-audit --no-fund
      - run: npm run check
